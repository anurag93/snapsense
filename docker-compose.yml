# Local databases for ConceptReel: MongoDB (videos, users, events, metrics) and Weaviate (vectors).
#   docker compose up -d
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.32.4
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports: ["8080:8080", "50051:50051"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none   # we send our own MiniLM vectors
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes: [weaviate-data:/var/lib/weaviate]
    restart: unless-stopped

volumes:
  mongo-data:
  weaviate-data:
